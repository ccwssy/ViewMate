name: Build and Attach DLL Assets

# 触发：push tag v* 自动构建并上传 DLL；也可 workflow_dispatch 手动为历史 tag 补资产
# Release notes：由 scripts/release-notes.sh 从 CHANGELOG.md 切片生成（中文、累计变更口径），
#   push tag 与 workflow_dispatch 补历史 tag 都会刷新 notes
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '目标 tag（如 v1.2.17.0），留空则用当前 ref'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore & Build (Release)
        run: |
          cd ViewMate
          dotnet build -c Release --nologo

      - name: Verify artifacts
        run: |
          ls -la ViewMate/bin/Release/net6.0/ViewMate.dll
          ls -la ViewMate/bin/Release/net6.0/TinyPinyin.dll

      - name: Attach DLLs to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.event.inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "Target tag: $TAG"
          DLL1="ViewMate/bin/Release/net6.0/ViewMate.dll"
          DLL2="ViewMate/bin/Release/net6.0/TinyPinyin.dll"
          # notes 从 CHANGELOG.md 切片生成；生成失败或产物为空时落回退文案，绝不阻断发版
          NOTES=/tmp/release-notes.md
          if ! bash scripts/release-notes.sh "$TAG" > "$NOTES" || [[ ! -s "$NOTES" ]]; then
            printf '未在 CHANGELOG.md 找到 %s 条目，详见 git log。\n' "$TAG" > "$NOTES"
          fi
          # release 不存在 → 创建；存在 → 刷新 notes 并上传资产（--clobber 覆盖重传）
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES"
            gh release upload "$TAG" "$DLL1" "$DLL2" --clobber
          else
            gh release create "$TAG" "$DLL1" "$DLL2" --title "$TAG" --notes-file "$NOTES"
          fi
          echo "Assets attached to $TAG:"
          gh release view "$TAG" --json assets -q '.assets[].name'

      - name: Demote older releases to draft (维护者 2026-10-16 政策：只保留一个正式发行版)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "本次正式发行版: $TAG —— 其余 published 全部转草稿（tag/assets 保留）"
          API="https://api.github.com/repos/${{ github.repository }}"
          gh api "$API/releases" --paginate \
            -q '.[] | select(.draft==false and .tag_name != "'"$TAG"'") | "\(.id) \(.tag_name)"' \
            | while read -r ID TN; do
                echo "  demote $TN (id=$ID)"
                # gh 的 -f 发送的是字符串 "true"（GitHub 静默忽略），必须用 -F 让 gh 推断成布尔；
                # PATCH 返回 0 不代表生效，回读一次 .draft 确认。
                gh api -X PATCH "$API/releases/$ID" -F draft=true >/dev/null
                CUR=$(gh api "$API/releases/$ID" -q '.draft')
                if [[ "$CUR" != "true" ]]; then
                  echo "::error::demote $TN (id=$ID) 未生效：回读 draft=$CUR"
                  exit 1
                fi
              done
          echo "剩余 published:"
          gh api "$API/releases" --paginate -q '.[] | select(.draft==false) | .tag_name'
